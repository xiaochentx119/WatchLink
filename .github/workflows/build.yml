name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 仓库里的 wrapper 默认指向腾讯云镜像（本机在国内用），CI 在海外，切回官方源
      - name: Use official Gradle distribution
        run: |
          sed -i 's#https://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set +e
          {
            echo "=== java ==="
            java -version 2>&1
            echo "=== sdk ==="
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"
            ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "=== gradle ==="
            ./gradlew --version 2>&1
            echo "=== tests ==="
            ./gradlew :shared:test assembleDebug assembleRelease --no-daemon --console=plain --stacktrace 2>&1
          } > build.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> build.log
          tail -60 build.log
          exit $code

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: watchlink-apks
          if-no-files-found: warn
          path: |
            phone/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk

      # 失败时把日志推到一个临时分支，方便直接读 raw 文件排查（无需 API）
      - name: Publish build log
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          BRANCH="ci-log-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          cp build.log ci-log.txt 2>/dev/null || echo "no build.log produced" > ci-log.txt
          git add -f ci-log.txt
          git commit -m "ci log ${GITHUB_RUN_ID}" || exit 0
          git push origin "$BRANCH"
