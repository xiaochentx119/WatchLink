name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 仓库里的 wrapper 默认指向腾讯云镜像（本机在国内用），CI 在海外，切回官方源
      - name: Use official Gradle distribution
        run: |
          sed -i 's#https://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :shared:test --no-daemon --console=plain

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: watchlink-apks
          if-no-files-found: error
          path: |
            phone/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          if-no-files-found: ignore
          path: shared/build/reports/tests/test/
