name: Release

# 推一个 v* 标签就会自动：编译 release APK → 建 GitHub Release → 把 APK 挂上去
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Use official Gradle distribution
        run: sed -i 's#https://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :shared:test --no-daemon --console=plain

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Collect assets
        run: |
          mkdir -p out
          cp phone/build/outputs/apk/release/phone-release.apk "out/WatchLink-phone-${GITHUB_REF_NAME}.apk"
          cp wear/build/outputs/apk/release/wear-release.apk   "out/WatchLink-wear-${GITHUB_REF_NAME}.apk"
          ls -lh out

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: WatchLink ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            手机端 + 手表端两个 APK，均为 R8 精简版、debug 签名，可直接安装。

            ## 安装

            **手机端**（Android 11+）
            - 下载 `WatchLink-phone-${{ github.ref_name }}.apk` 安装
            - 打开后授予「通知使用权」（设置 → 通知使用权 → 允许 WatchLink）
            - 界面上会显示手机局域网 IP 与端口 8975

            **手表端**（OPPO Watch X2 / Android 11，466×466）
            - 手表开发者选项打开 ADB 调试，连接同一 WiFi
            - `adb connect <手表IP>:5555`
            - `adb install -r WatchLink-wear-${{ github.ref_name }}.apk`

            ## 说明
            - 两端必须连同一个 WiFi（走局域网 TCP + UDP 发现，不依赖 Google 服务）
            - 手机端启动后有 3 分钟「可被发现」窗口，之后停止扫描并收起常驻通知
            - 详细功能与已知限制见仓库 README
          files: out/*.apk
